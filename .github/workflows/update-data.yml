name: Daily Data Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  incremental-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @antipodal/geo build

      - name: Determine date range
        id: dates
        run: |
          FETCH_START=$(date -u -d '10 days ago' +%F)
          FETCH_END=$(date -u +%F)
          echo "start=$FETCH_START" >> $GITHUB_OUTPUT
          echo "end=$FETCH_END" >> $GITHUB_OUTPUT
          echo "Fetching data for $FETCH_START to $FETCH_END"

      - name: Run pipeline
        working-directory: packages/data-pipeline
        run: pnpm pipeline --range ${{ steps.dates.outputs.start }} ${{ steps.dates.outputs.end }}

      - name: Write summary.json
        run: |
          cat > packages/data-pipeline/output/summary.json << EOF
          {"gridPoints":500,"startDate":"1940-01-01","endDate":"${{ steps.dates.outputs.end }}","monthCount":0}
          EOF

      - name: Upload monthly files to R2
        working-directory: packages/data-pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for file in output/months/*.json; do
            key="months/$(basename "$file")"
            npx wrangler r2 object put "antipodal-data/$key" --file "$file" --remote
          done
          echo "Uploaded $(ls output/months/*.json | wc -l) monthly files"

      - name: Upload summary to R2
        working-directory: packages/data-pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 object put antipodal-data/summary.json --file output/summary.json --remote
