name: Update Weather Data

on:
  schedule:
    - cron: '0 6 5 * *'  # 5th of each month at 6 AM UTC
  workflow_dispatch: {}    # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @antipodal/geo build
      - name: Determine date range
        id: dates
        run: |
          # Fetch the previous month's data (ERA5 has ~7 day lag)
          LAST_MONTH_START=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m-01)
          LAST_MONTH_END=$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m-%d)
          echo "start=$LAST_MONTH_START" >> $GITHUB_OUTPUT
          echo "end=$LAST_MONTH_END" >> $GITHUB_OUTPUT
          echo "Fetching data for $LAST_MONTH_START to $LAST_MONTH_END"
      - name: Run pipeline
        working-directory: packages/data-pipeline
        run: pnpm pipeline --range ${{ steps.dates.outputs.start }} ${{ steps.dates.outputs.end }}
      - name: Upload to R2
        working-directory: packages/data-pipeline/output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for file in months/*.json; do
            npx wrangler r2 object put "antipodal-data/$file" --file="$file"
          done
          npx wrangler r2 object put "antipodal-data/summary.json" --file="summary.json"
