<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="g" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="60%" stop-color="#0f1d32"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </radialGradient>
    <radialGradient id="amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="globe-clip">
      <circle cx="16" cy="16" r="14"/>
    </clipPath>
  </defs>

  <!-- globe body -->
  <circle cx="16" cy="16" r="14" fill="url(#g)"/>

  <!-- grid lines clipped to globe -->
  <g clip-path="url(#globe-clip)" opacity="0.3">
    <!-- meridians -->
    <ellipse cx="16" cy="16" rx="4.7" ry="14" fill="none" stroke="#64748b" stroke-width="0.4"/>
    <ellipse cx="16" cy="16" rx="9.3" ry="14" fill="none" stroke="#64748b" stroke-width="0.4"/>
    <ellipse cx="16" cy="16" rx="14" ry="14" fill="none" stroke="#64748b" stroke-width="0.4"/>
    <!-- parallels -->
    <ellipse cx="16" cy="8.5" rx="12.5" ry="3" fill="none" stroke="#64748b" stroke-width="0.4"/>
    <ellipse cx="16" cy="16" rx="14" ry="3.5" fill="none" stroke="#64748b" stroke-width="0.5"/>
    <ellipse cx="16" cy="23.5" rx="12.5" ry="3" fill="none" stroke="#64748b" stroke-width="0.4"/>
  </g>

  <!-- subtle rim light -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.6"/>

  <!-- arc connecting antipodal points -->
  <path d="M10.5 9 Q16 20 21.5 23" fill="none" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="1.5 1" opacity="0.5"/>

  <!-- amber point (selected) -->
  <circle cx="10.5" cy="9" r="1.2" fill="#f59e0b" opacity="0.3" filter="url(#glow)"/>
  <circle cx="10.5" cy="9" r="2.8" fill="url(#amber)" filter="url(#glow)"/>

  <!-- teal point (antipode) -->
  <circle cx="21.5" cy="23" r="1.2" fill="#0d9488" opacity="0.3" filter="url(#glow)"/>
  <circle cx="21.5" cy="23" r="2.8" fill="url(#teal)" filter="url(#glow)"/>
</svg>
